section_title: Research
items:
- date: '2026'
  title: 'QIAO-Bench: Evaluating Predictive World Models for Multi-Agent AI Scientists'
  subtitle: WM@Booth Workshop · Poster
  summary: A benchmark for predicting future workflow states in long-horizon AI-scientist trajectories.
    QIAO-Bench turns raw agent traces into structured state-action-outcome decision points and evaluates
    retrieval, linear, and JEPA-inspired predictors on held-out runs.
  topics:
  - Agentic AI
  - Benchmarking
  - Trajectory Analysis
  - World Models
  - Prediction
  paper_url: https://github.com/belsguidetotech/QIAO-Bench/blob/main/QIAO-Bench.pdf
  code_url: https://github.com/belsguidetotech/QIAO-Bench
- date: 2026 – Present
  title: Long-Horizon Agent Evaluation & Data Infrastructure
  subtitle: University of Chicago · Chicago Human + AI Lab
  summary: Building data, annotation, trajectory-analysis, evaluation, and context infrastructure for
    long-horizon research agents, with a focus on understanding where decisions change the course of an
    agent run and how errors propagate over time.
  topics:
  - Agent Evaluation
  - Trajectory Data
  - Data Infrastructure
  - Human-in-the-Loop
- date: 2026 – Present
  title: RecoverFlow
  subtitle: Failure Detection & Recovery for Long-Horizon Agents
  summary: Studies how failures emerge and propagate across agent trajectories, with the goal of detecting
    critical failure points early and selecting recovery actions before downstream errors compound.
  topics:
  - Agent Safety
  - Failure Detection
  - Recovery
  - Monitoring
- date: 2026 – Present
  title: TraceGuard
  subtitle: Trajectory-Level Safety Monitoring & Control
  summary: 'Explores safety signals and control mechanisms over agent execution traces: when to intervene,
    what evidence should trigger intervention, and how to constrain unsafe or unreliable behavior while
    preserving useful autonomy.'
  topics:
  - AI Safety
  - Agent Control
  - Monitoring
  - Intervention
- date: '2024'
  title: Explainable AI for Energy Forecasting
  subtitle: EIECT 2024
  summary: Built energy-consumption forecasting models with SHAP explanations to improve reliability,
    interpretability, and governance.
  topics:
  - Forecasting
  - Explainable AI
  - Energy
- date: '2023'
  title: Medical Image Classification & Interpretability
  subtitle: NTU Business AI Lab
  summary: Developed CNN-based breast-cancer detection and interpretability dashboards, including data
    augmentation and model-analysis workflows.
  topics:
  - Computer Vision
  - Medical AI
  - Interpretability
