    focus: Probabilistic prediction, calibration, and reliability
  - name: Predictability studies
    focus: When forecasting adds value versus when deterministic structure dominates
- title: ML Training & Adaptation
  description: Methods for training, adapting, and improving intelligent systems from data and feedback.
  items:
  - name: ML training
    focus: Supervised and representation learning
  - name: Post-training
    focus: Adaptation and alignment of foundation models
  - name: Reinforcement learning
    focus: Sequential decision making and policy improvement
  - name: Imitation learning
    focus: Learning from trajectories and demonstrations
