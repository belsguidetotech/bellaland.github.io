section_title: What I Build
tracks:
- title: Agent Benchmarking & Safety Alignment
  description: Understanding, predicting, monitoring, and controlling long-horizon AI agents.
  items:
  - name: QIAO-Bench
    focus: Trajectory analysis and prediction
    url: https://github.com/belsguidetotech/QIAO-Bench
  - name: RecoverFlow
    focus: Failure detection and recovery
  - name: TraceGuard
    focus: Safety monitoring and control
- title: ML Systems Infrastructure
  description: Data- and compute-intensive infrastructure for training and serving modern ML systems.
  items:
  - name: GPU-aware ML infrastructure
    focus: Scheduling, profiling, and utilization
  - name: vLLM
    focus: High-throughput LLM inference and serving
  - name: Data infrastructure
